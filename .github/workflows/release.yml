name: release

# Push a tag like v0.3.0 to publish a release: the tests run, the package is
# built (its version comes from the tag), and a GitHub Release is created with
# the wheel attached and the matching CHANGELOG.md section as its notes.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs reads the version from the tags

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Test
        run: |
          uv sync --extra dev
          uv run ruff check .
          uv run pytest -q

      - name: Build
        run: uv build

      - name: Check the version matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls dist/tavla-"$version"-py3-none-any.whl || {
            echo "::error::built $(ls dist), expected version $version"; exit 1; }

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="[$version]" '
            /^## / { if (found) exit; found = index($0, v) > 0; next }
            found' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || {
            echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "tavla $GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
