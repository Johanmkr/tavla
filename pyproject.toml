[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tavla"
dynamic = ["version"]
description = "CLI-first, git-native research operations tool: projects, tasks, deliverables and reading material."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "PyYAML>=6.0",
    "tomli-w>=1.0",
    "questionary>=2.0",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
]

[project.scripts]
tavla = "tavla.cli.main:app"
tv = "tavla.cli.main:app"

[tool.hatch.version]
# The version comes from the latest git tag: v0.2.0 -> 0.2.0, and commits
# after it -> 0.2.1.devN+g<sha>. Release by tagging (see CONTRIBUTING.md).
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/tavla"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
