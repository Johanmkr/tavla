[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tavla"
version = "0.1.0"
description = "CLI-first, git-native research operations tool: projects, tasks, deliverables and reading material."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "PyYAML>=6.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
tavla = "tavla.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tavla"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
